models:
  # FastSAM (preferred for complexity - much faster than SAM3)
  fastsam:
    model_path: ../External/Models/FastSAM/FastSAM-x.pt
    device: cuda
  # SAM3 (fallback - very slow, uses video model)
  sam:
    model_path: ../External/Models/sam3  # SAM3 HuggingFace format
    device: cuda
  dino:
    model_name: dinov3_vitl16
    model_path: ../External/Models/dinov3-vitl16-pretrain-lvd1689m  # local HuggingFace model
    device: cuda
    cache_dir: ../External/Models  # fallback for torch.hub
  detr:
    checkpoint: ../Eden/Checkpoints/DETR/DETR_Training_Sessions/2025-10-31_tooltip_single_class/DETR_Checkpoints/checkpoint_epoch_170.pth
    device: cuda
    num_labels: 1  # 1 class (tooltip) + no-object = 2 outputs
    confidence_threshold: 0.5
datasets:
  existing: ../Eden/Datasets/datasets_20250606.tar/datasets_20250606
  new_source: E:/cataract_surgery_Instruments_detection.v1i.coco/valid
  output: ./output/selected_dataset
fourier:
  similarity_threshold: 0.7  # Euclidean-based similarity (lower = stricter filtering)
  frequency_bands:
    low:
    - 0.0
    - 0.1
    mid:
    - 0.1
    - 0.5
    high:
    - 0.5
    - 1.0
  features:
  - low_band_energy
  - mid_band_energy
  - high_band_energy
  - spectral_entropy
  - frequency_centroid
sam:
  points_per_side: 32
  pred_iou_thresh: 0.88
  stability_score_thresh: 0.95
  min_mask_region_area: 100
dino:
  feature_dim: 1024  # DINOv3 ViT-L/16 has 1024-dim features
  batch_size: 8  # Adjust for ViT-L memory requirements
selection:
  # Selection method: 'cluster' (new, recommended) or 'kcenter' (legacy)
  method: cluster
  # Strategy for cluster-based selection:
  # - 'centroid': Select sample closest to cluster center (most typical)
  # - 'max_el2n': Select hardest sample per cluster (best for active learning)
  # - 'medoid': Select sample minimizing distance to all cluster members
  strategy: centroid
  # Legacy k-Center parameters (used when method: kcenter)
  el2n:
    proxy_epochs: 20
    batch_size: 16
    learning_rate: 0.001
    aggregation: mean
  k_center:
    target_size: 5000
    oversampling_factor: 2.0
    min_distance: 0.1
weights:
  fourier_uniqueness: 0.15
  dino_diversity: 0.35
  sam_complexity: 0.2
  el2n_difficulty: 0.3
output:
  target_size: 5000
  save_features: true
  generate_visualizations: true
  report_format: json
processing:
  num_workers: 4
  batch_size: 32
  use_cache: true  # Wczyta DINO, EL2N, Fourier, SAM z cache - przeskoczy do clustering
  cache_dir: ./output/feature_cache2_weighted
