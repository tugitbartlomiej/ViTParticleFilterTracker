# Konfiguracja Środowiska do Zaawansowanej Analizy Modeli

# Ścieżki do modeli (wytrenowane przez 100 epok)
# Uzupełnij na podstawie swoich wytrenowanych modeli. Poniżej przykłady z Twojego pliku benchmark_config.yaml
models:
  yolo:
    # Główna waga YOLO do testów (podane: models/YOLO/epoch100.pt)
    path: "../models/YOLO/epoch100.pt"
  detr:
    # DETR w formacie HuggingFace (folder z config.json + model.safetensors)
    # Obecny pipeline inferencji wymaga formatu HF.
    # Dostępny eksport: DETR/detr_inference_model_final
    path: "../DETR/detr_inference_model_final"

# Zbiór testowy
# Użyj dedykowanego, spójnego zbioru testowego dla obu modeli.
dataset:
  # Użyjemy walidacji jako zbioru testowego
  images_dir: "../BackgroundFinetuned/Datasets/TooltipMining/val"
  # Adnotacje COCO odpowiadające zbiorowi walidacyjnemu
  annotations_path: "../BackgroundFinetuned/Datasets/TooltipMining/annotations/val_annotations.json"

# Ustawienia wyjściowe
output:
  # Katalog, w którym zostaną zapisane wszystkie wyniki, raporty i wizualizacje
  directory: "./benchmark_results"

# Parametry inferencji
inference_params:
  confidence_threshold: 0.5 # Próg pewności dla detekcji
  iou_threshold: 0.5 # Próg IoU dla metryki mAP@.50

# Mapowanie etykiet modelowych -> id kategorii COCO
# Zbiór TooltipMining ma jedną kategorię z id=1 ("surgical_tool").
# Wymuś zgodność: indeks klasy 0 -> category_id 1 dla obu modeli.
label_map:
  yolo: { 0: 1 }
  detr: { 0: 1 }
