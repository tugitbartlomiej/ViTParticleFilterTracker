<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Session Graph View</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #eee;
            overflow: hidden;
        }
        #graph {
            width: 100vw;
            height: 100vh;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 26, 0.95);
            padding: 10px 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 { font-size: 1.2em; }
        .controls {
            display: flex;
            gap: 10px;
        }
        .controls button {
            padding: 6px 12px;
            background: #667eea;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.85em;
        }
        .controls button:hover { background: #5a6fd6; }
        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 15, 26, 0.95);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.8em;
            z-index: 100;
        }
        .legend-title { font-weight: 600; margin-bottom: 8px; color: #667eea; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .legend-diamond { width: 10px; height: 10px; transform: rotate(45deg); }

        .detail-panel {
            position: fixed;
            top: 50px;
            right: 0;
            width: 320px;
            height: calc(100vh - 50px);
            background: rgba(15, 15, 26, 0.98);
            border-left: 1px solid #333;
            padding: 20px;
            z-index: 100;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        .detail-panel.open { transform: translateX(0); }
        .detail-panel h2 { font-size: 1.1em; margin-bottom: 10px; color: #667eea; }
        .detail-panel .date { color: #888; font-size: 0.85em; margin-bottom: 15px; }
        .detail-panel .type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-bottom: 15px;
        }
        .detail-panel .objective {
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            padding: 10px;
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 15px;
        }
        .detail-panel .topics { margin-bottom: 15px; }
        .detail-panel .topic-tag {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 6px;
            font-size: 0.75em;
            margin: 2px;
            color: #a8b4ff;
        }
        .detail-panel .path {
            font-family: monospace;
            font-size: 0.75em;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 4px;
            color: #666;
            word-break: break-all;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #666;
            font-size: 1.5em;
            cursor: pointer;
        }
        .close-btn:hover { color: #fff; }

        .stats {
            font-size: 0.85em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Session Graph View</h1>
        <div class="controls">
            <button onclick="network.fit()">Fit View</button>
            <button onclick="togglePhysics()">Toggle Physics</button>
            <button onclick="filterSessions()">Sessions Only</button>
            <button onclick="showAll()">Show All</button>
        </div>
        <div class="stats" id="stats"></div>
    </div>

    <div id="graph"></div>

    <div class="legend">
        <div class="legend-title">Session Types</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div> Training</div>
        <div class="legend-item"><div class="legend-dot" style="background:#4ecdc4"></div> Analysis</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffeaa7"></div> Writing</div>
        <div class="legend-item"><div class="legend-dot" style="background:#a29bfe"></div> Benchmark</div>
        <div class="legend-item"><div class="legend-dot" style="background:#55efc4"></div> SSH</div>
        <div class="legend-item"><div class="legend-dot" style="background:#b2bec3"></div> Mixed</div>
        <div class="legend-title" style="margin-top:12px">Topics</div>
        <div class="legend-item"><div class="legend-diamond" style="background:#95a5a6"></div> Topic node</div>
    </div>

    <div class="detail-panel" id="detailPanel">
        <button class="close-btn" onclick="closePanel()">&times;</button>
        <div id="detailContent"></div>
    </div>

ing, Fourier, SAM, EL2N, DINO"}, {"from": "Session_2026-01-19_042000_YOLO_LR_Fix_Finetune", "to": "Session_2026-01-20_140500", "color": {"color": "rgba(102, 126, 234, 0.4)", "highlight": "#667eea"}, "width": 2, "dashes": true, "title": "Shared: YOLO, Training, SSH/Eden, GPU"}, {"from": "Session_2026-01-26_120245_Sessions_Visualization_RAG", "to": "Session_2025-11-17_DETR_YOLO_Benchmark_Fix", "color": {"color": "rgba(102, 126, 234, 0.4)", "highlight": "#667eea"}, "width": 2, "dashes": true, "title": "Shared: YOLO, DETR, SSH/Eden, Training"}, {"from": "Session_2026-01-26_120245_Sessions_Visualization_RAG", "to": "Session_2025-12-09_Advanced_Dataset_Selection_Plan", "color": {"color": "rgba(102, 126, 234, 0.4)", "highlight": "#667eea"}, "width": 2, "dashes": true, "title": "Shared: DETR, Dataset, Training, EL2N, DINO"}];

    const nodes = new vis.DataSet(nodesData);
    const edges = new vis.DataSet(edgesData);

    const container = document.getElementById('graph');
    const data = { nodes: nodes, edges: edges };

    const options = {
        physics: {
            enabled: true,
            barnesHut: {
                gravitationalConstant: -2000,
                centralGravity: 0.5,
                springLength: 95,
                springConstant: 0.05,
                damping: 0.2,
                avoidOverlap: 0.1
            },
            stabilization: {
                enabled: true,
                iterations: 40,
                updateInterval: 50,
                fit: true
            },
            adaptiveTimestep: true,
            maxVelocity: 50,
            minVelocity: 1.0
        },
        nodes: {
            borderWidth: 2,
            shadow: false,
            font: {
                color: '#ffffff'
            }
        },
        edges: {
            smooth: {
                enabled: true,
                type: 'dynamic',
                roundness: 0.5
            },
            shadow: false
        },
        interaction: {
            hover: true,
            tooltipDelay: 100,
            zoomView: true,
            dragView: true
        }
    };

    const network = new vis.Network(container, data, options);

    // Auto-disable physics after stabilization (performance boost)
    network.once('stabilizationIterationsDone', function() {
        network.setOptions({ physics: { enabled: false } });
        physicsEnabled = false;
    });

    // Stats
    const sessionCount = nodesData.filter(n => n.group === 'session').length;
    const topicCount = nodesData.filter(n => n.group === 'topic').length;
    document.getElementById('stats').textContent = `${sessionCount} sessions | ${topicCount} topics | ${edgesData.length} connections`;

    // Click handler
    network.on('click', function(params) {
        if (params.nodes.length > 0) {
            const nodeId = params.nodes[0];
            const node = nodes.get(nodeId);
            if (node.data) {
                showDetail(node.data);
            }
        }
    });

    // Double click to show only this node and its connections
    let isFiltered = false;
    network.on('doubleClick', function(params) {
        if (params.nodes.length > 0) {
            const nodeId = params.nodes[0];
            
            // Find all connected nodes
            const connectedEdges = edgesData.filter(e => e.from === nodeId || e.to === nodeId);
            const connectedNodeIds = new Set([nodeId]);
            connectedEdges.forEach(e => {
                connectedNodeIds.add(e.from);
                connectedNodeIds.add(e.to);
            });
            
            // Filter to show only connected nodes and edges
            const filteredNodes = nodesData.filter(n => connectedNodeIds.has(n.id));
            const filteredEdges = connectedEdges;
            
            nodes.clear();
            edges.clear();
            nodes.add(filteredNodes);
            edges.add(filteredEdges);
            
            isFiltered = true;
            network.fit({ animation: true });
            
            // Update stats
            document.getElementById('stats').textContent = `Showing: ${filteredNodes.length} nodes | ${filteredEdges.length} connections (double-click empty space to reset)`;
        } else {
            // Double click on empty space - reset to show all
            if (isFiltered) {
                showAll();
                isFiltered = false;
            }
        }
    });

    function showDetail(session) {
        const panel = document.getElementById('detailPanel');
        const content = document.getElementById('detailContent');

        const typeColors = {
            "Training": "#ff6b6b",
            "Analysis": "#4ecdc4",
            "Writing": "#ffeaa7",
            "Benchmark": "#a29bfe",
            "SSH": "#55efc4",
            "Mixed": "#b2bec3"
        };

        content.innerHTML = `
            <h2>${session.label}</h2>
            <div class="date">${session.date} | ${session.name}</div>
            <span class="type-badge" style="background:${typeColors[session.type] || '#b2bec3'}40; color:${typeColors[session.type] || '#b2bec3'}">${session.type}</span>
            <div class="objective">${session.objective || 'No objective recorded'}</div>
            <div class="topics">
                ${session.topics.map(t => `<span class="topic-tag">${t}</span>`).join('')}
            </div>
            <div class="path">.sessions/${session.id}/</div>
        `;

        panel.classList.add('open');
    }

    function closePanel() {
        document.getElementById('detailPanel').classList.remove('open');
    }

    let physicsEnabled = true;
    function togglePhysics() {
        physicsEnabled = !physicsEnabled;
        network.setOptions({ physics: { enabled: physicsEnabled } });
    }

    function filterSessions() {
        const sessionNodes = nodesData.filter(n => n.group === 'session');
        const sessionIds = sessionNodes.map(n => n.id);
        const sessionEdges = edgesData.filter(e =>
            sessionIds.includes(e.from) && sessionIds.includes(e.to)
        );
        nodes.clear();
        edges.clear();
        nodes.add(sessionNodes);
        edges.add(sessionEdges);
    }

    function showAll() {
        nodes.clear();
        edges.clear();
        nodes.add(nodesData);
        edges.add(edgesData);
        isFiltered = false;
        // Reset stats
        const sessionCount = nodesData.filter(n => n.group === 'session').length;
        const topicCount = nodesData.filter(n => n.group === 'topic').length;
        document.getElementById('stats').textContent = `${sessionCount} sessions | ${topicCount} topics | ${edgesData.length} connections`;
    }
    </script>
