# Training Configuration for YOLOv8
# Example configuration file

# Model
model: yolov8n.pt  # or yolov8s.pt, yolov8m.pt, yolov8l.pt, yolov8x.pt

# Dataset
data: yolo_dataset/data.yaml

# Training parameters
epochs: 100
patience: 50
batch: 16
imgsz: 640

# Optimizer
optimizer: auto  # auto, SGD, Adam, AdamW
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0

# Other
workers: 8
project: surgical_tools_yolo_results
name: exp
exist_ok: False
pretrained: True
verbose: True
seed: 0
deterministic: True
single_cls: False
image_weights: False
rect: False
cos_lr: False
close_mosaic: 0
resume: False
amp: True
overlap_mask: True
mask_ratio: 4
dropout: 0.0

# Inference
conf: 0.25
iou: 0.7
max_det: 300
